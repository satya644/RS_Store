<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — RS Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <form class="header-search" onsubmit="return goSearch(event, 'products.html')">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="header-search-input" placeholder="Search jewellery…">
    </form>
    <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="cart.html" class="cart-link"><i class="fa-solid fa-cart-shopping"></i> <span class="cart-badge">0</span></a>
      <span id="profile-icon-slot" data-prefix=""></span>
    </nav>
  </div>
</header>

<div class="back-bar"><button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button></div>

<div class="page-wrap" id="checkout-root">
  <h1>Checkout</h1>
  <form class="checkout-form" id="checkout-form">
    <div>
      <label>Full name</label>
      <input type="text" name="customerName" required>
    </div>
    <div class="form-row">
      <div>
        <label>Phone number</label>
        <input type="tel" name="phone" required pattern="[0-9]{10}" title="10 digit phone number">
      </div>
      <div>
        <label>Email (optional)</label>
        <input type="email" name="email">
      </div>
    </div>
    <div>
      <label>Address</label>
      <input type="text" name="line1" placeholder="House no., street, area" required>
    </div>
    <div class="form-row">
      <div>
        <label>City</label>
        <input type="text" name="city" required>
      </div>
      <div>
        <label>State</label>
        <input type="text" name="state" required>
      </div>
    </div>
    <div>
      <label>Pincode</label>
      <input type="text" name="pincode" required pattern="[0-9]{6}" title="6 digit pincode">
    </div>
    <input type="hidden" name="paymentMethod" value="COD">
    <p style="padding-top:4px; font-size:14px; color:var(--ink-700);">Payment method: <strong>Cash on Delivery</strong></p>
    <div class="cart-summary" id="checkout-total"><span>Total</span><span>₹0</span></div>
    <button type="submit" class="btn">Place order</button>
    <p id="checkout-error" style="color:var(--maroon-800); font-size:14px; display:none;"></p>
  </form>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <a href="../index.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
      <p>Small-batch jewellery, made with care and worn with pride.</p>
    </div>
    <div class="footer-col">
      <h4>Shop</h4>
      <a href="products.html">Full collection</a>
      <a href="cart.html">Your cart</a>
    </div>
    <div class="footer-col">
      <h4>Reach us</h4>
      <p>sm9268459@gmail.com</p>
      <a href="tel:+916386325046">+91 63863 25046</a>
    </div>
  </div>
  <p class="footer-bottom">© 2026 RS Store. All pieces made with love. Founder: Satyam Maurya</p>
</footer>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/customerAuth.js"></script>
<script src="../js/authGuard.js"></script>
<script src="../js/searchSuggest.js"></script>
<script src="../js/whatsapp.js"></script>
<script>
  function goSearch(e, targetUrl) {
    e.preventDefault();
    const q = document.getElementById('header-search-input').value.trim();
    window.location.href = targetUrl + (q ? '?search=' + encodeURIComponent(q) : '');
    return false;
  }

  const items = cart.get();
  if (items.length === 0) window.location.href = 'products.html';

  document.getElementById('checkout-total').innerHTML = `<span>Total</span><span>₹${cart.total()}</span>`;

  if (customerAuth.isLoggedIn()) {
    const c = customerAuth.getCustomer();
    const form = document.getElementById('checkout-form');
    if (c.name) form.customerName.value = c.name;
    if (c.phone) form.phone.value = c.phone;
    if (c.email) form.email.value = c.email;
    if (c.address?.line1) form.line1.value = c.address.line1;
    if (c.address?.city) form.city.value = c.address.city;
    if (c.address?.state) form.state.value = c.address.state;
    if (c.address?.pincode) form.pincode.value = c.address.pincode;
  }

  document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const errorEl = document.getElementById('checkout-error');
    const btn = form.querySelector('button[type="submit"]');

    errorEl.style.display = 'none';
    errorEl.textContent = '';

    const orderData = {
      customerName: form.customerName.value,
      phone: form.phone.value,
      email: form.email.value,
      address: { line1: form.line1.value, city: form.city.value, state: form.state.value, pincode: form.pincode.value },
      paymentMethod: 'COD',
      items: items.map(i => ({ productId: i.productId, quantity: i.quantity })),
    };

    btn.textContent = 'Placing order…';
    btn.disabled = true;

    try {
      const res = await api.placeOrder(orderData);
      if (!res.success) throw new Error(res.message || 'Something went wrong');
      cart.clear();
      document.getElementById('checkout-root').innerHTML = `
        <div class="order-success">
          <h1>Order placed ✓</h1>
          <p>Thank you, ${orderData.customerName}. We'll reach out on ${orderData.phone} to confirm delivery. Pay cash when it arrives!</p>
          <a href="../index.html" class="btn">Back to home</a>
        </div>
      `;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.textContent = 'Place order';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
