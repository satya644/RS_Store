<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — RS Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <form class="header-search" onsubmit="return goSearch(event, 'products.html')">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="header-search-input" placeholder="Search jewellery…">
    </form>
    <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="cart.html" class="cart-link"><i class="fa-solid fa-cart-shopping"></i> <span class="cart-badge">0</span></a>
      <span id="profile-icon-slot" data-prefix=""></span>
    </nav>
  </div>
</header>

<div class="back-bar"><button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button></div>

<div class="filter-bar">
  <div class="filter-group">
    <label>Category</label>
    <select id="f-category">
      <option value="">All</option>
      <option value="Necklace">Necklace</option>
      <option value="Earrings">Earrings</option>
      <option value="Ring">Ring</option>
      <option value="Bracelet">Bracelet</option>
      <option value="Anklet">Anklet</option>
      <option value="Set">Set</option>
      <option value="Other">Other</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Min Price</label>
    <input type="number" id="f-min" placeholder="₹0" min="0">
  </div>
  <div class="filter-group">
    <label>Max Price</label>
    <input type="number" id="f-max" placeholder="₹10000" min="0">
  </div>
  <div class="filter-group">
    <label>Sort by</label>
    <select id="f-sort">
      <option value="">Newest</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="rating">Top rated</option>
    </select>
  </div>
  <span class="filter-clear" onclick="clearFilters()">Clear filters</span>
</div>

<div class="product-grid" id="all-grid">
  <p class="empty-state" style="grid-column: 1/-1;">Loading pieces…</p>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <a href="../index.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
      <p>Small-batch jewellery, made with care and worn with pride.</p>
    </div>
    <div class="footer-col">
      <h4>Shop</h4>
      <a href="products.html">Full collection</a>
      <a href="cart.html">Your cart</a>
    </div>
    <div class="footer-col">
      <h4>Reach us</h4>
      <p>sm9268459@gmail.com</p>
      <a href="tel:+916386325046">+91 63863 25046</a>
    </div>
  </div>
  <p class="footer-bottom">© 2026 RS Store. All pieces made with love. Founder: Satyam Maurya</p>
</footer>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/customerAuth.js"></script>
<script src="../js/authGuard.js"></script>
<script src="../js/searchSuggest.js"></script>
<script src="../js/whatsapp.js"></script>
<script>
  let debounceTimer;
  let searchTerm = '';

  function starsHtml(rating) {
    const full = Math.round(Number(rating) || 0);
    let html = '<span class="stars">';
    for (let i = 1; i <= 5; i++) html += i <= full ? '★' : '<span class="empty">★</span>';
    html += '</span>';
    return html;
  }

  function buildQuery() {
    const params = new URLSearchParams();
    const category = document.getElementById('f-category').value;
    const minPrice = document.getElementById('f-min').value;
    const maxPrice = document.getElementById('f-max').value;
    const sort = document.getElementById('f-sort').value;

    if (searchTerm) params.set('search', searchTerm);
    if (category) params.set('category', category);
    if (minPrice) params.set('minPrice', minPrice);
    if (maxPrice) params.set('maxPrice', maxPrice);
    if (sort) params.set('sort', sort);
    params.set('limit', '100');
    return '?' + params.toString();
  }

  async function loadAll() {
    const grid = document.getElementById('all-grid');
    grid.innerHTML = '<p class="empty-state" style="grid-column: 1/-1;">Loading pieces…</p>';
    try {
      const res = await api.getProducts(buildQuery());
      if (!res.data || res.data.length === 0) {
        grid.innerHTML = '<p class="empty-state" style="grid-column: 1/-1;">No pieces match your filters.</p>';
        return;
      }
      grid.innerHTML = res.data.map(renderCard).join('');
    } catch (e) {
      grid.innerHTML = '<p class="empty-state" style="grid-column: 1/-1;">Could not load the collection right now.</p>';
    }
  }

  function renderCard(p) {
    const img = p.images?.[0]?.url || 'https://via.placeholder.com/400x400/f5ead9/6b1233?text=RS+Store';
    const hasDiscount = Number(p.discountPrice) > 0;
    const finalPrice = hasDiscount ? p.discountPrice : p.price;
    return `
      <a class="product-card" href="product.html?id=${p._id}">
        <div class="product-image"><img src="${img}" alt="${p.name}" loading="lazy"></div>
        <p class="product-material">${p.material || 'Handcrafted'}</p>
        <h3 class="product-name">${p.name}</h3>
        ${p.numReviews > 0 ? `${starsHtml(p.averageRating)}<span class="rating-count">(${p.numReviews})</span>` : ''}
        <p class="product-price">
          ${hasDiscount ? `<span class="price-strike">₹${p.price}</span>` : ''}
          ₹${finalPrice}
        </p>
      </a>`;
  }

  function clearFilters() {
    document.getElementById('f-category').value = '';
    document.getElementById('f-min').value = '';
    document.getElementById('f-max').value = '';
    document.getElementById('f-sort').value = '';
    searchTerm = '';
    document.getElementById('header-search-input').value = '';
    loadAll();
  }

  ['f-category', 'f-sort'].forEach((id) => {
    document.getElementById(id).addEventListener('change', loadAll);
  });

  ['f-min', 'f-max'].forEach((id) => {
    document.getElementById(id).addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadAll, 350);
    });
  });

  const urlParams = new URLSearchParams(window.location.search);
  const preselectCategory = urlParams.get('category');
  if (preselectCategory) document.getElementById('f-category').value = preselectCategory;
  searchTerm = urlParams.get('search') || '';
  if (searchTerm) document.getElementById('header-search-input').value = searchTerm;

  function goSearch(e, targetUrl) {
    e.preventDefault();
    const q = document.getElementById('header-search-input').value.trim();
    searchTerm = q;
    window.history.replaceState({}, '', targetUrl + (q ? '?search=' + encodeURIComponent(q) : ''));
    loadAll();
    return false;
  }

  loadAll();
</script>
</body>
</html>
