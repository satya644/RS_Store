<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — RS Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <form class="header-search" onsubmit="return goSearch(event, 'products.html')">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="header-search-input" placeholder="Search jewellery…">
    </form>
    <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="cart.html" class="cart-link"><i class="fa-solid fa-cart-shopping"></i> <span class="cart-badge">0</span></a>
      <span id="profile-icon-slot" data-prefix=""></span>
    </nav>
  </div>
</header>

<div class="back-bar"><button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button></div>

<div class="page-wrap" style="max-width:420px;">
  <h1 style="font-size:32px;">Sign in</h1>
  <form id="login-form" style="display:grid; gap:18px;">
    <div>
      <label>Mobile number</label>
      <input type="tel" name="phone" required pattern="[0-9]{10}" title="10 digit phone number">
    </div>
    <div>
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">Sign in</button>
    <p class="msg" id="login-msg" style="font-size:13px;"></p>
  </form>
  <p style="margin-top:20px; font-size:14px;">New here? <a href="signup.html" style="color:var(--gold-600); border-bottom:1px solid var(--gold-500);">Create an account</a></p>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <a href="../index.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
      <p>Small-batch jewellery, made with care and worn with pride.</p>
    </div>
    <div class="footer-col">
      <h4>Shop</h4>
      <a href="products.html">Full collection</a>
      <a href="cart.html">Your cart</a>
    </div>
    <div class="footer-col">
      <h4>Reach us</h4>
      <p>sm9268459@gmail.com</p>
      <a href="tel:+916386325046">+91 63863 25046</a>
    </div>
  </div>
  <p class="footer-bottom">© 2026 RS Store. All pieces made with love. Founder: Satyam Maurya</p>
</footer>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/customerAuth.js"></script>
<script src="../js/searchSuggest.js"></script>
<script src="../js/whatsapp.js"></script>
<script>
  function goSearch(e, targetUrl) {
    e.preventDefault();
    const q = document.getElementById('header-search-input').value.trim();
    window.location.href = targetUrl + (q ? '?search=' + encodeURIComponent(q) : '');
    return false;
  }

  if (customerAuth.isLoggedIn()) window.location.href = 'profile.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msg = document.getElementById('login-msg');
    const btn = form.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res = await customerApi.login(form.phone.value, form.password.value);
      if (!res.success) throw new Error(res.message);
      customerAuth.setToken(res.data.token);
      customerAuth.setCustomer(res.data);
      const redirectTo = sessionStorage.getItem('sj_redirect_after_login');
      sessionStorage.removeItem('sj_redirect_after_login');
      window.location.href = redirectTo || 'profile.html';
    } catch (err) {
      msg.textContent = err.message || 'Could not sign in';
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
