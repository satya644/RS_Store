<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f030d">
<meta name="robots" content="noindex, nofollow">
<title>Site Settings — RS Store Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="settings.html" class="active">Site Settings</a>
      <a href="account.html">Account</a>
    </nav>
    <p class="logout" onclick="auth.logout()">Log out</p>
  </aside>

  <main class="main">
    <div class="page-header"><h1>Homepage settings</h1></div>

    <div class="table-wrap" style="padding: 32px;">
      <h2 style="font-size:22px; margin-bottom:8px;">Hero slider</h2>
      <p style="font-size:13px; color:var(--ink-700); margin-bottom:20px;">Add one or more slides — with more than one, the homepage will auto-rotate between them with arrows to navigate.</p>
      <div id="slide-list"></div>
      <button type="button" class="btn btn-outline" onclick="addSlide()" style="margin-top:12px;">+ Add slide</button>
      <div style="margin-top:24px;">
        <button type="button" class="btn" onclick="saveSlides()">Save hero slider</button>
        <p class="msg" id="hero-msg"></p>
      </div>

      <h2 style="font-size:22px; margin: 40px 0 20px; padding-top:32px; border-top:1px solid rgba(197, 155, 63, 0.3);">Categories</h2>
      <div id="category-list"></div>
      <button type="button" class="btn btn-outline" onclick="addCategoryRow()" style="margin-top:12px;">+ Add category</button>
      <div style="margin-top:24px;">
        <button type="button" class="btn" onclick="saveCategories()">Save categories</button>
        <p class="msg" id="category-msg"></p>
      </div>
    </div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="js/adminApi.js"></script>
<script>
  auth.requireAuth();
  let slides = [];
  let categories = [];

  async function loadSettings() {
    try {
      const res = await fetch(`${API_BASE_URL}/settings`);
      const json = await res.json();
      const s = json.data;

      slides = (s && s.heroSlides && s.heroSlides.length) ? s.heroSlides : [{ image: '', heading: '', subtext: '', buttonText: 'Shop now' }];
      renderSlides();

      categories = (s && s.categories) ? s.categories : [];
      renderCategories();
    } catch (e) {
      alert('Could not load settings');
    }
  }

  function renderSlides() {
    document.getElementById('slide-list').innerHTML = slides.map((sl, i) => `
      <div style="border:1px solid rgba(197, 155, 63, 0.3); border-radius:6px; background:#fff; padding:20px; margin-bottom:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <strong style="font-family:var(--serif); font-size:18px; color:var(--burgundy-900);">Slide ${i + 1}</strong>
          ${slides.length > 1 ? `<span class="btn-sm btn-danger" style="cursor:pointer;" onclick="removeSlide(${i})">Remove slide</span>` : ''}
        </div>
        <div class="form-group">
          <label>Photo</label>
          <input type="file" accept="image/*" onchange="uploadSlideImage(${i}, this.files)">
          <div class="image-preview-row">
            ${sl.image ? `<div class="image-preview"><img src="${sl.image}"><div class="x" onclick="removeSlideImage(${i})">×</div></div>` : ''}
          </div>
        </div>
        <div class="form-group">
          <label>Heading</label>
          <input type="text" value="${sl.heading || ''}" onchange="slides[${i}].heading = this.value">
        </div>
        <div class="form-group">
          <label>Subtext</label>
          <textarea onchange="slides[${i}].subtext = this.value">${sl.subtext || ''}</textarea>
        </div>
        <div class="form-group">
          <label>Button text</label>
          <input type="text" value="${sl.buttonText || 'Shop now'}" onchange="slides[${i}].buttonText = this.value">
        </div>
      </div>
    `).join('');
  }

  async function uploadSlideImage(index, files) {
    const msg = document.getElementById('hero-msg');
    msg.textContent = 'Uploading…';
    msg.className = 'msg';
    try {
      const res = await adminApi.uploadImages(files);
      if (!res.success) throw new Error(res.message);
      slides[index].image = res.data[0].url;
      renderSlides();
      msg.textContent = '';
    } catch (err) {
      msg.textContent = err.message || 'Upload failed';
      msg.className = 'msg error';
    }
  }

  function removeSlideImage(index) {
    slides[index].image = '';
    renderSlides();
  }

  function addSlide() {
    slides.push({ image: '', heading: '', subtext: '', buttonText: 'Shop now' });
    renderSlides();
  }

  function removeSlide(index) {
    slides.splice(index, 1);
    renderSlides();
  }

  async function saveSlides() {
    const msg = document.getElementById('hero-msg');
    try {
      const res = await fetch(`${API_BASE_URL}/settings`, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ heroSlides: slides }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      msg.textContent = 'Saved ✓';
      msg.className = 'msg success';
    } catch (err) {
      msg.textContent = err.message || 'Could not save';
      msg.className = 'msg error';
    }
  }

  function renderCategories() {
    document.getElementById('category-list').innerHTML = categories.map((c, i) => `
      <div class="form-row" style="align-items:end; margin-bottom:16px; border-bottom:1px solid rgba(197, 155, 63, 0.2); padding-bottom:16px;">
        <div class="form-group">
          <label>Category name</label>
          <input type="text" value="${c.name}" onchange="categories[${i}].name = this.value">
        </div>
        <div class="form-group">
          <label>Icon photo</label>
          <input type="file" accept="image/*" onchange="uploadCategoryImage(${i}, this.files)">
          <div class="image-preview-row">
            ${c.image ? `<div class="image-preview"><img src="${c.image}"><div class="x" onclick="removeCategory(${i})">×</div></div>` : `<span class="btn-sm btn-danger" style="cursor:pointer;" onclick="removeCategory(${i})">Remove</span>`}
          </div>
        </div>
      </div>
    `).join('');
  }

  async function uploadCategoryImage(index, files) {
    const msg = document.getElementById('category-msg');
    msg.textContent = 'Uploading…';
    msg.className = 'msg';
    try {
      const res = await adminApi.uploadImages(files);
      if (!res.success) throw new Error(res.message);
      categories[index].image = res.data[0].url;
      renderCategories();
      msg.textContent = '';
    } catch (err) {
      msg.textContent = err.message || 'Upload failed';
      msg.className = 'msg error';
    }
  }

  function removeCategory(index) {
    categories.splice(index, 1);
    renderCategories();
  }

  function addCategoryRow() {
    categories.push({ name: '', image: '' });
    renderCategories();
  }

  async function saveCategories() {
    const msg = document.getElementById('category-msg');
    try {
      const res = await fetch(`${API_BASE_URL}/settings`, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ categories }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      msg.textContent = 'Saved ✓';
      msg.className = 'msg success';
    } catch (err) {
      msg.textContent = err.message || 'Could not save';
      msg.className = 'msg error';
    }
  }

  loadSettings();
</script>
</body>
</html>
