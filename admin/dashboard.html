<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d0c1d">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — RS Store Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="settings.html">Site Settings</a>
      <a href="account.html">Account</a>
    </nav>
    <p class="logout" onclick="auth.logout()">Log out</p>
  </aside>

  <main class="main">
    <div class="page-header"><h1 id="welcome">Welcome back</h1></div>

    <div class="stat-cards">
      <div class="stat-card"><p class="label">Total Products</p><p class="value" id="stat-products">–</p></div>
      <div class="stat-card"><p class="label">Total Orders</p><p class="value" id="stat-orders">–</p></div>
      <div class="stat-card"><p class="label">Pending Orders</p><p class="value" id="stat-pending">–</p></div>
    </div>

    <h2 style="font-size:24px; margin-bottom:16px;">Recent orders</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="recent-orders"><tr><td colspan="5" class="empty-row">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="js/adminApi.js"></script>
<script>
  auth.requireAuth();
  const admin = auth.getAdmin();
  if (admin) document.getElementById('welcome').textContent = `Welcome back, ${admin.name}`;

  async function loadDashboard() {
    try {
      const [productsRes, ordersRes] = await Promise.all([
        adminApi.getProducts('?limit=1'),
        adminApi.getOrders('?limit=100'),
      ]);

      document.getElementById('stat-products').textContent = productsRes.total ?? 0;
      document.getElementById('stat-orders').textContent = ordersRes.total ?? 0;

      const orders = ordersRes.data || [];
      const pending = orders.filter(o => o.orderStatus === 'Placed' || o.orderStatus === 'Confirmed').length;
      document.getElementById('stat-pending').textContent = pending;

      const recent = orders.slice(0, 5);
      const tbody = document.getElementById('recent-orders');
      tbody.innerHTML = recent.length
        ? recent.map(o => `
            <tr>
              <td data-label="Customer">${o.customerName}</td>
              <td data-label="Phone">${o.phone}</td>
              <td data-label="Total">₹${o.totalAmount}</td>
              <td data-label="Status"><span class="badge ${o.orderStatus}">${o.orderStatus}</span></td>
              <td data-label="Date">${new Date(o.createdAt).toLocaleDateString()}</td>
            </tr>`).join('')
        : '<tr><td colspan="5" class="empty-row">No orders yet.</td></tr>';
    } catch (e) {
      document.getElementById('recent-orders').innerHTML = '<tr><td colspan="5" class="empty-row">Could not load dashboard data.</td></tr>';
    }
  }

  loadDashboard();
</script>
</body>
</html>
