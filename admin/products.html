<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d0c1d">
<meta name="robots" content="noindex, nofollow">
<title>Products — RS Store Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="orders.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="settings.html">Site Settings</a>
      <a href="account.html">Account</a>
    </nav>
    <p class="logout" onclick="auth.logout()">Log out</p>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1>Products</h1>
      <button class="btn" onclick="openForm()">+ Add product</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody id="products-body"><tr><td colspan="6" class="empty-row">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="overlay" id="form-overlay" style="display:none;">
  <div class="modal">
    <h2 id="form-title">Add product</h2>
    <form id="product-form">
      <input type="hidden" id="p-id">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="p-name" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="p-description" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="p-price" min="0" required>
        </div>
        <div class="form-group">
          <label>Discount Price (₹, optional)</label>
          <input type="number" id="p-discountPrice" min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="p-category" required>
            <option value="Necklace">Necklace</option>
            <option value="Earrings">Earrings</option>
            <option value="Ring">Ring</option>
            <option value="Bracelet">Bracelet</option>
            <option value="Anklet">Anklet</option>
            <option value="Set">Set</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Material</label>
          <input type="text" id="p-material" placeholder="e.g. Kundan, Gold Plated">
        </div>
      </div>
      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="p-stock" min="0" required>
      </div>
      <div class="form-group">
        <label>Images (aap ek se zyada photo select kar sakte ho)</label>
        <input type="file" id="p-images" multiple accept="image/*">
        <div class="image-preview-row" id="image-preview-row"></div>
      </div>
      <div class="form-group">
        <label>Video (optional)</label>
        <input type="file" id="p-video" accept="video/*">
        <div id="video-preview-row" style="margin-top:10px;"></div>
      </div>
      <p class="msg" id="form-msg"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeForm()">Cancel</button>
        <button type="submit" class="btn" id="save-btn">Save product</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="js/adminApi.js"></script>
<script>
  auth.requireAuth();
  let uploadedImages = [];
  let uploadedVideo = null;
  let editingId = null;

  async function loadProducts() {
    const tbody = document.getElementById('products-body');
    try {
      const res = await adminApi.getProducts();
      const products = res.data || [];
      tbody.innerHTML = products.length
        ? products.map(p => `
            <tr>
              <td class="thumb-cell">${p.images?.[0]?.url ? `<img class="thumb" src="${p.images[0].url}" alt="">` : '<div class="thumb thumb-empty"></div>'}</td>
              <td data-label="Name">${p.name}</td>
              <td data-label="Category">${p.category}</td>
              <td data-label="Price">₹${p.discountPrice > 0 ? p.discountPrice : p.price}</td>
              <td data-label="Stock">${p.stock}</td>
              <td class="actions">
                <button class="btn btn-outline btn-sm" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p._id}')">Delete</button>
              </td>
            </tr>`).join('')
        : '<tr><td colspan="6" class="empty-row">No products yet. Add your first piece.</td></tr>';
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Could not load products.</td></tr>';
    }
  }

  function openForm() {
    editingId = null;
    uploadedImages = [];
    uploadedVideo = null;
    document.getElementById('form-title').textContent = 'Add product';
    document.getElementById('product-form').reset();
    document.getElementById('image-preview-row').innerHTML = '';
    document.getElementById('video-preview-row').innerHTML = '';
    document.getElementById('form-msg').textContent = '';
    document.getElementById('form-overlay').style.display = 'flex';
  }

  function closeForm() {
    document.getElementById('form-overlay').style.display = 'none';
  }

  function editProduct(p) {
    editingId = p._id;
    uploadedImages = p.images || [];
    uploadedVideo = p.video?.url ? p.video : null;
    document.getElementById('form-title').textContent = 'Edit product';
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-description').value = p.description;
    document.getElementById('p-price').value = p.price;
    document.getElementById('p-discountPrice').value = p.discountPrice || '';
    document.getElementById('p-category').value = p.category;
    document.getElementById('p-material').value = p.material || '';
    document.getElementById('p-stock').value = p.stock;
    renderPreviews();
    renderVideoPreview();
    document.getElementById('form-msg').textContent = '';
    document.getElementById('form-overlay').style.display = 'flex';
  }

  function renderPreviews() {
    document.getElementById('image-preview-row').innerHTML = uploadedImages.map((img, i) => `
      <div class="image-preview">
        <img src="${img.url}">
        <div class="x" onclick="removeImage(${i})">×</div>
      </div>`).join('');
  }

  function removeImage(index) {
    uploadedImages.splice(index, 1);
    renderPreviews();
  }

  function renderVideoPreview() {
    const row = document.getElementById('video-preview-row');
    row.innerHTML = uploadedVideo
      ? `<div style="position:relative; display:inline-block;">
          <video src="${uploadedVideo.url}" controls style="width:180px; display:block;"></video>
          <div class="x" style="position:absolute; top:-8px; right:-8px;" onclick="removeVideo()">×</div>
        </div>`
      : '';
  }

  function removeVideo() {
    uploadedVideo = null;
    renderVideoPreview();
  }

  document.getElementById('p-video').addEventListener('change', async (e) => {
    if (!e.target.files.length) return;
    const msg = document.getElementById('form-msg');
    msg.textContent = 'Uploading video…';
    msg.className = 'msg';
    try {
      const res = await adminApi.uploadVideo(e.target.files[0]);
      if (!res.success) throw new Error(res.message);
      uploadedVideo = res.data;
      renderVideoPreview();
      msg.textContent = '';
    } catch (err) {
      msg.textContent = err.message || 'Video upload failed';
      msg.className = 'msg error';
    }
  });

  document.getElementById('p-images').addEventListener('change', async (e) => {
    const msg = document.getElementById('form-msg');
    msg.textContent = 'Uploading images…';
    msg.className = 'msg';
    try {
      const res = await adminApi.uploadImages(e.target.files);
      if (!res.success) throw new Error(res.message);
      uploadedImages = [...uploadedImages, ...res.data];
      renderPreviews();
      msg.textContent = '';
    } catch (err) {
      msg.textContent = err.message || 'Upload failed';
      msg.className = 'msg error';
    }
  });

  document.getElementById('product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('form-msg');
    const btn = document.getElementById('save-btn');

    const data = {
      name: document.getElementById('p-name').value,
      description: document.getElementById('p-description').value,
      price: Number(document.getElementById('p-price').value),
      discountPrice: Number(document.getElementById('p-discountPrice').value) || 0,
      category: document.getElementById('p-category').value,
      material: document.getElementById('p-material').value,
      stock: Number(document.getElementById('p-stock').value),
      images: uploadedImages,
      video: uploadedVideo || { url: '', publicId: '' },
    };

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = editingId ? await adminApi.updateProduct(editingId, data) : await adminApi.createProduct(data);
      if (!res.success) throw new Error(res.message);
      closeForm();
      loadProducts();
    } catch (err) {
      msg.textContent = err.message || 'Could not save product';
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save product';
    }
  });

  async function deleteProduct(id) {
    if (!confirm('Remove this product from the store?')) return;
    try {
      await adminApi.deleteProduct(id);
      loadProducts();
    } catch (e) {
      alert('Could not delete product');
    }
  }

  loadProducts();
</script>
</body>
</html>
