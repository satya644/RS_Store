<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d0c1d">
<meta name="robots" content="noindex, nofollow">
<title>Account — RS Store Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><img src="../images/logo.png" alt="RS Store logo" class="brand-logo"><span class="brand-text">RS <span>Store</span></span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="settings.html">Site Settings</a>
      <a href="account.html" class="active">Account</a>
    </nav>
    <p class="logout" onclick="auth.logout()">Log out</p>
  </aside>

  <main class="main">
    <div class="page-header"><h1>My account</h1></div>

    <div class="table-wrap" style="padding: 32px; max-width:480px;">
      <p style="font-size:13px; color:var(--ink-700); margin-bottom:20px;">Apna login email ya password badalne ke liye, pehle apna current password daalo (security ke liye).</p>
      <form id="account-form">
        <div class="form-group">
          <label>Current password (zaroori hai)</label>
          <input type="password" id="current-password" required>
        </div>
        <div class="form-group">
          <label>New email (chhod do agar nahi badalna)</label>
          <input type="email" id="new-email" placeholder="naya email">
        </div>
        <div class="form-group">
          <label>New password (chhod do agar nahi badalna)</label>
          <input type="password" id="new-password" placeholder="kam se kam 6 characters" minlength="6">
        </div>
        <button type="submit" class="btn">Save changes</button>
        <p class="msg" id="account-msg"></p>
      </form>
    </div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="js/adminApi.js"></script>
<script>
  auth.requireAuth();

  document.getElementById('account-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('account-msg');
    const btn = e.target.querySelector('button');
    const currentPassword = document.getElementById('current-password').value;
    const newEmail = document.getElementById('new-email').value.trim();
    const newPassword = document.getElementById('new-password').value.trim();

    if (!newEmail && !newPassword) {
      msg.textContent = 'Email ya password mein se kam se kam ek field bharo.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch(`${API_BASE_URL}/admin/profile`, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ currentPassword, newEmail: newEmail || undefined, newPassword: newPassword || undefined }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);

      auth.setToken(json.data.token);
      auth.setAdmin({ name: json.data.name, email: json.data.email });

      msg.textContent = 'Saved ✓ — naya email/password ab se use karo.';
      msg.className = 'msg success';
      e.target.reset();
    } catch (err) {
      msg.textContent = err.message || 'Could not save changes';
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save changes';
    }
  });
</script>
</body>
</html>
