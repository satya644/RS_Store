<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d0c1d">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — RS Store</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <img src="../images/logo.png" alt="RS Store" style="display:block; width:96px; height:96px; margin:0 auto 14px;">
    <h1>RS <span style="color:var(--gold-600); font-style:italic;">Store</span></h1>
    <p class="sub">Admin Panel</p>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Sign in</button>
      <p class="msg error" id="login-error" style="display:none;"></p>
    </form>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="js/adminApi.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const errorEl = document.getElementById('login-error');
    const btn = form.querySelector('button');

    btn.textContent = 'Signing in…';
    errorEl.style.display = 'none';
    // free hosting "sleeps" when unused, so the first request can take up to ~50 seconds
    const slowHint = setTimeout(() => {
      errorEl.className = 'msg';
      errorEl.textContent = 'Server abhi jaag raha hai (free hosting) — 30-50 second lag sakte hain, thoda ruko…';
      errorEl.style.display = 'block';
    }, 6000);
    btn.disabled = true;

    try {
      const res = await adminApi.login(form.email.value, form.password.value);
      if (!res.success) throw new Error(res.message || 'Login failed');
      auth.setToken(res.data.token);
      auth.setAdmin({ name: res.data.name, email: res.data.email });
      window.location.href = 'dashboard.html';
    } catch (err) {
      clearTimeout(slowHint);
      errorEl.className = 'msg error';
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.textContent = 'Sign in';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
